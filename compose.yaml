services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-celcoin}
      POSTGRES_USER: ${POSTGRES_USER:-celcoin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-celcoin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - celcoin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"
volumes:
  celcoin-postgres:
